[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain-lab"
version = "0.1.0"
description = "Game-independent MaleCNS simulator extracted from DOOMFLY"
requires-python = ">=3.11"
dependencies = ["numpy", "numba", "pandas", "pyarrow"]

[project.optional-dependencies]
test = ["pytest", "brian2"]

[tool.setuptools]
packages = ["brainlab"]

[tool.setuptools.package-data]
brainlab = ["datasets.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
