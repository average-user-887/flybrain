[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neurofly"
version = "0.4.0"
description = "A MaleCNS connectome coupled to an articulated FlyGym body"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "numba", "pandas>=2.2,<4", "pyarrow>=16"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

[project.optional-dependencies]
body = [
    "flygym==2.1.0; python_version >= '3.12' and python_version < '3.15'",
    "mujoco==3.9.0; python_version >= '3.12' and python_version < '3.15'",
]
test = ["pytest", "brian2"]
# NVIDIA GPU for the connectome brain (LIF v3, v4, v5). CuPy plus the CUDA 12 runtime
# wheels it needs (NVRTC for the v3 kernel, cuSPARSE for v4/v5); needs only an NVIDIA
# driver for CUDA 12 or newer, no CUDA toolkit. About 3 GB. Do not add numba-cuda: its
# 0.30.x releases do not work with numpy 2.5 (the engine detects that and ignores it).
gpu = ["cupy-cuda12x[ctk]>=13", "scipy"]
# Optional explicit AMD/Vulkan fixed-v3 compute. CPU/default installations do
# not import wgpu. Device/runtime acceptance is separate from installation.
amd = ["wgpu==0.32.0"]
# Real-browser dashboard checks (scripts/live_ui_signoff.py, tests/test_browser_recovery.py).
# Also needs Firefox and geckodriver from the system (not installable with pip).
browser-test = ["selenium>=4"]

[project.scripts]
neurofly = "neurofly.cli:main"

[tool.setuptools]
packages = ["neurofly", "neurofly._docs", "brainlab", "brainlab.cohort", "experiments", "neurofly_body", "neurofly_studio", "validation", "validation.paradigms", "web"]
py-modules = [
    "arena",
    "assay_controls",
    "assay_response",
    "central_complex",
    "circuit",
    "connectome_bridge",
    "connectome_client",
    "data_logger",
    "env_adapter",
    "experiment_brains",
    "experiment_registry",
    "learning_recorder",
    "locomotion",
    "maze",
    "mechanosensory",
    "metabolic",
    "neurofly_daemon",
    "online_metrics",
    "observation_envelopes",
    "observation_publication",
    "provenance",
    "stream_gateway",
    "surge_cast",
    "vision",
]

[tool.setuptools.package-dir]
# Install the canonical matrix as a private resource without a second source copy.
"neurofly._docs" = "docs"

[tool.setuptools.package-data]
"neurofly._docs" = ["CAPABILITY_MATRIX.md"]
web = ["*.html", "*.js", "*.css", "vendor/*.js"]
brainlab = ["datasets.json", "graph_pins.json", "wgpu_v3_math.wgsl"]
"brainlab.cohort" = ["cohort_contract.json"]
validation = ["specs/*.json", "specs/sources/*.json"]
# experiments/data/ (historical lesion-study output, legacy heuristic, not v0.4
# evidence) stays in git but is deliberately not packaged.

[tool.pytest.ini_options]
testpaths = ["tests"]
