<svg xmlns='http://www.w3.org/2000/svg' width='960' height='640' viewBox='0 0 960 640'><!-- SPDX-License-Identifier: MIT; Project NeuroFly; generated by tools/assets/env/make_icons.py --><rect x='0' y='0' width='960' height='640' rx='14' fill='#fbfaf7' stroke='#26231f' stroke-width='2'/><text x='32' y='50' font-family='DejaVu Sans, Verdana, sans-serif' font-size='28' font-weight='bold' fill='#26231f'>NeuroFly environment legend: taste vs odour</text><g transform='translate(32 92) scale(1.25)'><title>Sugar water: taste on contact</title><rect x='2' y='2' width='60' height='60' rx='9' fill='#f5f3ee' stroke='#26231f' stroke-width='2'/><path d='M32 13.75 C34.5 20.0 43.25 28.75 43.25 36.25 A11.25 11.25 0 0 1 20.75 36.25 C20.75 28.75 29.5 20.0 32 13.75 Z' fill='#1f6fd1' stroke='#26231f' stroke-width='1.6'/><path d='M26 30 q3 -6 6 -9' stroke='#ffffff' stroke-width='2.2' fill='none' stroke-linecap='round'/><rect x='12' y='50' width='40' height='5' rx='1.5' fill='#1f6fd1' stroke='#26231f' stroke-width='1.4'/><path d='M8 40 l8 9 M16 49 l-1 -6 M16 49 l-6 0' stroke='#26231f' stroke-width='2' fill='none' stroke-linecap='round'/></g><text x='212' y='116' font-family='DejaVu Sans, Verdana, sans-serif' font-size='21' font-weight='bold' fill='#26231f'>Sugar taste  -  CONTACT</text><text x='212' y='142' font-family='DejaVu Sans, Verdana, sans-serif' font-size='16' fill='#26231f'>Gustatory. Detected only when the tarsi or proboscis TOUCH the solution.</text><text x='212' y='164' font-family='DejaVu Sans, Verdana, sans-serif' font-size='16' fill='#26231f'>Solid droplet on a solid bar; a solid ring marks the contact zone. No range in air.</text><g transform='translate(32 194) scale(1.25)'><title>Odour source: volatile, detected at a distance</title><rect x='2' y='2' width='60' height='60' rx='9' fill='#f5f3ee' stroke='#26231f' stroke-width='2'/><circle cx='32' cy='44' r='9' fill='none' stroke='#7a2bc2' stroke-width='2.4' stroke-dasharray='4 3.5'/><circle cx='32' cy='44' r='16' fill='none' stroke='#7a2bc2' stroke-width='2.4' stroke-dasharray='4 3.5'/><path d='M24 30 c-4 -4 4 -8 0 -12 c-4 -4 4 -8 0 -11' fill='none' stroke='#7a2bc2' stroke-width='2.2' stroke-linecap='round'/><path d='M32 30 c-4 -4 4 -8 0 -12 c-4 -4 4 -8 0 -11' fill='none' stroke='#7a2bc2' stroke-width='2.2' stroke-linecap='round'/><path d='M40 30 c-4 -4 4 -8 0 -12 c-4 -4 4 -8 0 -11' fill='none' stroke='#7a2bc2' stroke-width='2.2' stroke-linecap='round'/><circle cx='32' cy='44' r='4.5' fill='#7a2bc2' stroke='#26231f' stroke-width='1.4'/></g><text x='212' y='218' font-family='DejaVu Sans, Verdana, sans-serif' font-size='21' font-weight='bold' fill='#26231f'>Volatile odour  -  AIRBORNE, AT A DISTANCE</text><text x='212' y='244' font-family='DejaVu Sans, Verdana, sans-serif' font-size='16' fill='#26231f'>Olfactory. Molecules travel through air and reach the antennae.</text><text x='212' y='266' font-family='DejaVu Sans, Verdana, sans-serif' font-size='16' fill='#26231f'>Dashed rings mark the SOURCE POSITION only, never a measured concentration or plume.</text><g transform='translate(32 296) scale(1.25)'><title>Wind: arrow tip points where the air goes</title><rect x='2' y='2' width='60' height='60' rx='9' fill='#f5f3ee' stroke='#26231f' stroke-width='2'/><path d='M8 18 h30' stroke='#0b7f88' stroke-width='2' stroke-linecap='round' stroke-dasharray='6 4'/><path d='M8 46 h26' stroke='#0b7f88' stroke-width='2' stroke-linecap='round' stroke-dasharray='6 4'/><path d='M10 32 H42' stroke='#0b7f88' stroke-width='5' stroke-linecap='round'/><path d='M40 22 L56 32 L40 42 Z' fill='#0b7f88' stroke='#26231f' stroke-width='1.5'/><path d='M8 25 L16 32 L8 39 Z' fill='#e8870f' stroke='#26231f' stroke-width='1.3'/></g><text x='212' y='320' font-family='DejaVu Sans, Verdana, sans-serif' font-size='21' font-weight='bold' fill='#26231f'>Wind direction</text><text x='212' y='346' font-family='DejaVu Sans, Verdana, sans-serif' font-size='16' fill='#26231f'>Arrow tip points where the air moves TO (downwind); the orange fin trails upwind.</text><text x='212' y='368' font-family='DejaVu Sans, Verdana, sans-serif' font-size='16' fill='#26231f'>If the engine has no wind field the display must say NOT SIMULATED.</text><g transform='translate(32 398) scale(1.25)'><title>Fermenting fruit</title><rect x='2' y='2' width='60' height='60' rx='9' fill='#f5f3ee' stroke='#26231f' stroke-width='2'/><polygon points='32.0,10.0 52.9,25.2 44.9,49.8 19.1,49.8 11.1,25.2' fill='#d9a91a' stroke='#26231f' stroke-width='1.8' stroke-linejoin='round'/><circle cx='32' cy='32' r='16.5' fill='#eedca5' stroke='#a07a30' stroke-width='1'/><path d='M20 38 a13 13 0 0 0 12 9 a9 9 0 0 1 -12 -9 Z' fill='#8a5a1c' opacity='0.85'/><path d='M42 22 a13 13 0 0 1 4 9 a8 8 0 0 0 -4 -9 Z' fill='#8a5a1c' opacity='0.85'/><ellipse cx='32.0' cy='28.0' rx='3' ry='1.6' fill='#26231f' transform='rotate(0 32.0 28.0)'/><ellipse cx='35.5' cy='34.0' rx='3' ry='1.6' fill='#26231f' transform='rotate(60 35.5 34.0)'/><ellipse cx='28.5' cy='34.0' rx='3' ry='1.6' fill='#26231f' transform='rotate(-60 28.5 34.0)'/><circle cx='44' cy='40' r='2.2' fill='#ffffff' stroke='#8a5a1c' stroke-width='1'/><circle cx='39' cy='45' r='1.5' fill='#ffffff' stroke='#8a5a1c' stroke-width='1'/><circle cx='22' cy='25' r='1.6' fill='#ffffff' stroke='#8a5a1c' stroke-width='1'/></g><g transform='translate(116 398) scale(1.25)'><title>Yeast / food patch</title><rect x='2' y='2' width='60' height='60' rx='9' fill='#f5f3ee' stroke='#26231f' stroke-width='2'/><ellipse cx='32' cy='46' rx='26' ry='7' fill='#8a5a1c' stroke='#26231f' stroke-width='1.6'/><path d='M12 44 C14 26 50 22 52 44 Z' fill='#d8c08a' stroke='#26231f' stroke-width='1.6'/><circle cx='22' cy='33' r='3.2' fill='#f3e3b8' stroke='#8a6d36' stroke-width='1'/><circle cx='30' cy='29' r='3.8' fill='#f3e3b8' stroke='#8a6d36' stroke-width='1'/><circle cx='39' cy='31' r='3.2' fill='#f3e3b8' stroke='#8a6d36' stroke-width='1'/><circle cx='45' cy='36' r='2.6' fill='#f3e3b8' stroke='#8a6d36' stroke-width='1'/><circ