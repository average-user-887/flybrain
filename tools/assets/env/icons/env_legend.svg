t-family='DejaVu Sans, Verdana, sans-serif' font-size='16' fill='#26231f'>is implemented, and they do not change looming or retinal input.</text><text x='32' y='618' font-family='DejaVu Sans, Verdana, sans-serif' font-size='14' fill='#55504a'>Colour is supplementary: each sense also has its own shape (solid bar and ring vs dashed rings and wavy lines). Presentation only.</text></svg>
