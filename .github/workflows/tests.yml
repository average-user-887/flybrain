name: tests

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    name: pytest (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and all branches: the commit-metadata guard below needs the
          # pushed range (before..after) or the pull request's base and head commits.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Run test suite
        env:
          PYTHONPATH: .
          NUMBA_CACHE_DIR: ${{ runner.temp }}/numba-cache
        run: python -m pytest -q -p no:cacheprovider tests/

      - name: Release hygiene guard (no personal or private-infrastructure data)
        # Private IPs, home/share/agent-scratch paths, non-noreply e-mail addresses,
        # machine hostnames and known private tokens. Allow-list:
        # scripts/private_infra_allowlist.txt. Its own test: tests/test_private_infra_guard.py.
        run: bash scripts/check_private_infra.sh

      - name: Commit metadata guard (only the commits this push or pull request adds)
        # Messages, author and committer of new commits: agent session links and
        # trailers, non-noreply e-mail, hostnames, private tokens. Published history
        # before this guard is an accepted residual (docs/OWNER_DECISIONS.md,
        # 2026-10-05 "no rewrite"), so only the new range is scanned. Range rules
        # (PR base..head; push before..after; first push of a branch: commits no other
        # branch has; manual runs: skipped) live in scripts/ci_commit_range.sh.
        # Locally, before pushing: scripts/check_private_infra.sh --commits origin/master..HEAD
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          range="$(bash scripts/ci_commit_range.sh)"
          if [ -z "$range" ]; then
            echo "event $EVENT introduces no commits; metadata guard skipped"
            exit 0
          fi
          echo "commit range: $range"
          bash scripts/check_private_infra.sh --commits "$range"
